[project]
name = "crawler-common"
version = "0.1.0"
description = "Shared utilities for crawler applications"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.26.0",
    "httpx>=0.27.0",
    "pika>=1.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

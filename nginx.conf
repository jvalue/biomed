server {
    listen 80;
    server_name _;

    root /var/www/;
    index index.html;

    # Cache-Control für index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Alle anderen Dateien mit Cache
    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public";
    }
}

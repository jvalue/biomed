server {
    listen 80;
    server_name _;

    root /var/www/;
    index index.html;

    # Cache-Control for index.html to prevent caching
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # All other files allow caching (main.js name is content-hashed)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public";
    }
}

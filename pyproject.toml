# pyproject.toml - Package definition and tool configuration for JValue BioMed

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jvalue-biomed"
version = "0.1.0"
description = "Core utilities for JValue BioMed Airflow pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "JValue BioMed Team"}
]
dependencies = []  # No runtime dependencies yet - add as needed

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# Ruff configuration
# https://docs.astral.sh/ruff/
# ============================================================================

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "venv",
    "logs",
    "plugins",
    "config",
]
line-length = 100
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]

ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "DTZ001",  # datetime without timezone (common in Airflow)
    "DTZ005",  # datetime.now() without timezone
    "RUF012",  # mutable class attributes
    "N802",    # function name should be lowercase (some Airflow patterns)
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["jvalue_biomed", "dags"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Mypy configuration
# https://mypy.readthedocs.io/en/stable/config_file.html
# ============================================================================

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_decorators = false  # Airflow decorators are untyped
mypy_path = "src:dags"
namespace_packages = true
explicit_package_bases = true
platform = "linux"
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
color_output = true
error_summary = true
incremental = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["airflow.*", "airflow.providers.*", "pendulum.*", "croniter.*", "dateutil.*", "requests.*"]
ignore_missing_imports = true

# ============================================================================
# Pytest configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/jvalue_biomed",
    "--cov-report=term-missing",
]

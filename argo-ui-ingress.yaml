apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-server-ingress
  namespace: argo
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
  labels:
    app: server
spec:
  ingressClassName: private-ingress
  rules:
    - http:
        paths:
          - path: /argo
            pathType: Prefix
            backend:
              service:
                name: argo-server
                port:
                  number: 80
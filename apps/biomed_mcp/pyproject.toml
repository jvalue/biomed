[project]
name = "biomed-mcp"
version = "0.1.0"
description = "Unified MCP server for Biomed — combines PostgreSQL and S3 access via GraphQL"
requires-python = ">=3.13"
dependencies = [
    "crawler-common",
    "mcp[cli]>=1.0.0,<2",
    "strawberry-graphql>=0.262.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-sugar>=1.0.0",
    "ruff>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biomed_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.coverage.run]
branch = true
source = ["biomed_mcp"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov=biomed_mcp --cov-report=term-missing"

[tool.ruff]
exclude = [".ruff_cache", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

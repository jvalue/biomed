[tool.coverage.run]
branch = true
source = [ "crawler_dummy" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/apps/crawler/html'
 --cov-report xml:'../../../coverage/apps/crawler/coverage.xml'
 --html='../../../reports/apps/crawler/unittests/html/index.html'
 --junitxml='../../../reports/apps/crawler/unittests/junit.xml'
"""

[project]
name = "crawler-dummy"
version = "0.1.0"
description = "Dummy crawler app"
requires-python = ">=3.13"
dependencies = [
  "crawler-common",
]

[tool.uv.sources]
crawler-common = { path = "../../../libs/crawler-common" }

[dependency-groups]
dev = [
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler_dummy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

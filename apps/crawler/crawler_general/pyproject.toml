[tool.coverage.run]
branch = true
source = [ "crawler_general" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/apps/crawler/html'
 --cov-report xml:'../../../coverage/apps/crawler/coverage.xml'
 --html='../../../reports/apps/crawler/unittests/html/index.html'
 --junitxml='../../../reports/apps/crawler/unittests/junit.xml'
"""

[project]
name = "crawler-general"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.13"
readme = 'README.md'
dependencies = [
    "crawler-common",
]

[tool.hatch.build.targets.wheel]
packages = ["crawler_general"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

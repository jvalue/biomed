[project]
name = "xml-ingestor"
version = "0.1.0"
description = "Stream XSD and XML into PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "crawler-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[tool.coverage.run]
branch = true
source = ["xml_ingestor"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["xml_ingestor"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/apps/xml_ingestor/html'
 --cov-report xml:'../../../coverage/apps/xml_ingestor/coverage.xml'
 --html='../../../reports/apps/xml_ingestor/unittests/html/index.html'
 --junitxml='../../../reports/apps/xml_ingestor/unittests/junit.xml'
"""

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
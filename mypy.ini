# Mypy configuration for Airflow DAGs
# https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
# Python version
python_version = 3.10

# Strict mode - enables all strict type checking flags
# This includes: disallow_untyped_defs, disallow_any_generics, disallow_subclassing_any,
# disallow_untyped_calls, disallow_incomplete_defs, check_untyped_defs,
# disallow_untyped_decorators, no_implicit_optional, warn_redundant_casts,
# warn_unused_ignores, warn_return_any, warn_no_return, warn_unreachable, strict_equality
strict = True

# Airflow decorators are untyped, so we need to relax this rule
disallow_untyped_decorators = False

# Import discovery
mypy_path = dags
namespace_packages = True
explicit_package_bases = True

# Platform configuration
platform = linux

# Configuring error messages
show_error_context = True
show_column_numbers = True
show_error_codes = True
pretty = True
color_output = True
error_summary = True

# Incremental mode
incremental = True
cache_dir = .mypy_cache

# Per-module options
[mypy-airflow.*]
ignore_missing_imports = True

[mypy-airflow.providers.*]
ignore_missing_imports = True

[mypy-pendulum.*]
ignore_missing_imports = True

[mypy-croniter.*]
ignore_missing_imports = True

[mypy-dateutil.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

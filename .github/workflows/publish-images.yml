name: Publish Container Images

on:
  workflow_dispatch:
  release:
    types: [ 'created' ]
  workflow_run:
    workflows: [ "CI Workspaces" ]
    types: [ "completed" ]
    branches: [ "main" ]

jobs:
  management-backend-build-and-publish:
    name: Publish Management Backend to GitHub Container registry
    if: ${{ github.event_name == 'release' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker compose build management-backend

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io/jvalue
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Container registry
        run: |
          # Image name as described in docker-compose.yaml using the image key
          IMAGE_NAME=management-backend
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          # Get version from release name or latest if triggered manually
          VERSION=$(echo "${{ github.event.release.tag_name || github.sha }}")

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID --all-tags

  management-frontend-build-and-publish:
    name: Publish Management Frontend to GitHub Container registry
    if: ${{ github.event_name == 'release' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker compose build management-frontend

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io/jvalue
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Container registry
        run: |
          # Image name as described in docker-compose.yaml using the image key
          IMAGE_NAME=management-frontend
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          # Get version from release name or latest if triggered manually
          VERSION=$(echo "${{ github.event.release.tag_name || github.sha }}")

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID --all-tags
name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/**"
      - "libs/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "package.json"
      - "vitest.workspace.ts"
      - "nx.json"
      - "biome.json"
      - "components.json"
      - "docker-compose.yml"
      - "management-frontend.Dockerfile"
      - "management-backend.Dockerfile"
      - "nginx.conf"
  pull_request:
    branches: [ "**" ]
    paths:
      - "apps/**"
      - "libs/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "package.json"
      - "vitest.workspace.ts"
      - "nx.json"
      - "biome.json"
      - "components.json"
      - "docker-compose.yml"
      - "management-frontend.Dockerfile"
      - "management-backend.Dockerfile"
      - "nginx.conf"

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      management_frontend_changed: ${{ steps.filter.outputs.management_frontend }}
      management_backend_changed: ${{ steps.filter.outputs.management_backend }}
      python_changed: ${{ steps.filter.outputs.python }}
      config_changed: ${{ steps.filter.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            management_frontend:
              - 'apps/management-frontend/**'
            management_backend:
              - 'apps/management-backend/**'
            python:
              - 'apps/crawler/**'
              - 'libs/crawler-common/**'
              - 'pyproject.toml'
            config:
              - '.github/workflows/**'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'vitest.workspace.ts'
              - 'nx.json'
              - 'biome.json'
              - 'components.json'
              - 'docker-compose.yml'
              - 'management-frontend.Dockerfile'
              - 'management-backend.Dockerfile'
              - 'nginx.conf'

  management-frontend:
    name: Management Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.management_frontend_changed == 'true' || needs.detect-changes.outputs.config_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint (Nx)
        run: npx nx run management-frontend:lint

      - name: Build (Nx)
        run: npx nx run management-frontend:build

      - name: Test (Nx)
        run: npx nx run management-frontend:test

  management-backend:
    name: Management Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.management_backend_changed == 'true' || needs.detect-changes.outputs.config_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint (Nx)
        run: npx nx run management-backend:lint

      - name: Build (Nx)
        run: npx nx run management-backend:build

      - name: Test (Nx)
        run: npx nx run management-backend:test

  crawler-python:
    name: Crawler Python CI
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changed == 'true' || needs.detect-changes.outputs.config_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync Python workspace dependencies
        run: uv sync --all-groups

      - name: Test crawler-common
        run: uv run pytest libs/crawler-common/tests

      - name: Test crawler apps
        run: uv run pytest apps/crawler/tests

name: Deploy via Helm

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (exact SHA or tag, leave empty to use SHA of latest published images)'
        required: false
        default: ''
      target_env:
        description: 'Target environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
  workflow_run:
    workflows: [ "Publish Container Images" ]
    types: [ "completed" ]
    branches: [ "main" ]

jobs:
  # -----------------------------------------------------------------------
  # Resolve image tag.
  # Automatic trigger (workflow_run): uses the SHA of the publish-images run.
  # Manual trigger (workflow_dispatch): uses the input tag, or fetches the
  # SHA of the last successful publish-images run if left empty.
  # -----------------------------------------------------------------------
  set-env:
    name: Resolve image tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      target_env: ${{ steps.resolve.outputs.target_env }}
    steps:
      - name: Resolve image tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
            ENV="dev"
          else
            ENV="${{ inputs.target_env }}"
            TAG="${{ inputs.image_tag }}"
            if [ -z "$TAG" ]; then
              TAG=$(gh api \
                "/repos/${{ github.repository }}/actions/workflows/publish-images.yml/runs?branch=main&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha')
            fi
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_env=$ENV" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Dev deployment
  # -----------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    runs-on: [Linux, k8s-access]
    needs: set-env
    if: ${{ needs.set-env.outputs.target_env == 'dev' }}
    environment: dev

    container:
      image: ubuntu:latest

    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.15.2'

      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm dependency build
        run: helm dependency build ./biomed-chart

      - name: Helm upgrade --install (dev)
        run: |
          IMAGE_TAG="${{ needs.set-env.outputs.image_tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          helm upgrade --install biomed ./biomed-chart \
            --namespace "${K8S_NAMESPACE:-biomed-dev}" \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set management-backend.image.name="${REGISTRY}/management-backend" \
            --set management-backend.image.tag="${IMAGE_TAG}" \
            --set management-frontend.image.name="${REGISTRY}/management-frontend" \
            --set management-frontend.image.tag="${IMAGE_TAG}"
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE_DEV }}

      - name: Deployment summary
        run: |
          echo "## ✅ Dev Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`dev\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image tag** | \`${{ needs.set-env.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # Production deployment
  # -----------------------------------------------------------------------
  deploy-prod:
    name: Deploy to prod
    runs-on: [Linux, k8s-access]
    needs: set-env
    if: ${{ needs.set-env.outputs.target_env == 'prod' }}
    environment: prod

    container:
      image: ubuntu:latest

    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.15.2'

      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm dependency build
        run: helm dependency build ./biomed-chart

      - name: Helm upgrade --install (prod)
        run: |
          IMAGE_TAG="${{ needs.set-env.outputs.image_tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          helm upgrade --install biomed ./biomed-chart \
            --namespace "${K8S_NAMESPACE:-biomed}" \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set management-backend.image.name="${REGISTRY}/management-backend" \
            --set management-backend.image.tag="${IMAGE_TAG}" \
            --set management-frontend.image.name="${REGISTRY}/management-frontend" \
            --set management-frontend.image.tag="${IMAGE_TAG}"
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE_PROD }}

      - name: Deployment summary
        run: |
          echo "## ✅ Production Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`prod\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image tag** | \`${{ needs.set-env.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"

name: Deploy via Helm

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (exact SHA or tag, leave empty to use SHA of latest published images)'
        required: false
        default: ''
      target_env:
        description: 'Target environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  # -----------------------------------------------------------------------
  # Resolve image tag.
  # If left empty, the SHA of the last successful publish-images run is used.
  # -----------------------------------------------------------------------
  set-env:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve image tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows/publish-images.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha')
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Dev deployment
  # -----------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    runs-on: [Linux, k8s-access]
    needs: set-env
    if: ${{ github.event.inputs.target_env == 'dev' }}
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm dependency build
        run: helm dependency build ./biomed-chart

      - name: Helm upgrade --install (dev)
        run: |
          IMAGE_TAG="${{ needs.set-env.outputs.image_tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          helm upgrade --install \
            "${HELM_RELEASE_NAME:-biomed}" \
            ./biomed-chart \
            --namespace "${K8S_NAMESPACE:-biomed-dev}" \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set management-backend.image.repository="${REGISTRY}/management-backend" \
            --set management-backend.image.tag="${IMAGE_TAG}" \
            --set management-frontend.image.repository="${REGISTRY}/management-frontend" \
            --set management-frontend.image.tag="${IMAGE_TAG}"
        env:
          HELM_RELEASE_NAME: ${{ secrets.HELM_RELEASE_NAME }}
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE_DEV }}

      - name: Deployment summary
        run: |
          echo "## ✅ Dev Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`dev\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image tag** | \`${{ needs.set-env.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # Production deployment
  # -----------------------------------------------------------------------
  deploy-prod:
    name: Deploy to prod
    runs-on: [Linux, k8s-access]
    needs: set-env
    if: ${{ github.event.inputs.target_env == 'prod' }}
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm dependency build
        run: helm dependency build ./biomed-chart

      - name: Helm upgrade --install (prod)
        run: |
          IMAGE_TAG="${{ needs.set-env.outputs.image_tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          helm upgrade --install \
            "${HELM_RELEASE_NAME:-biomed}" \
            ./biomed-chart \
            --namespace "${K8S_NAMESPACE:-biomed}" \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set management-backend.image.repository="${REGISTRY}/management-backend" \
            --set management-backend.image.tag="${IMAGE_TAG}" \
            --set management-frontend.image.repository="${REGISTRY}/management-frontend" \
            --set management-frontend.image.tag="${IMAGE_TAG}"
        env:
          HELM_RELEASE_NAME: ${{ secrets.HELM_RELEASE_NAME }}
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE_PROD }}

      - name: Deployment summary
        run: |
          echo "## ✅ Production Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`prod\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image tag** | \`${{ needs.set-env.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"

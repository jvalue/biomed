services:
  biomed-db:
    image: postgres:18.1
    user: "postgres"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5435:5432"

  crawler-general:
    build:
      context: ./apps/crawler
    working_dir: /app
    command: uv run crawler_general/hello.py
    volumes:
      - ./apps/crawler:/app

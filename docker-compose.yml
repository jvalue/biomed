services:
  biomed-db:
    image: postgres:18.1
    user: "postgres"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5435
    ports:
      - "5435:5435"

  biomed-crawler-db:
    image: postgres:18.1
    user: "postgres"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5436
    ports:
      - "5436:5436"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
      
  crawler-general:
    build:
      context: .
      dockerfile: apps/crawler/crawler_general/Dockerfile
    env_file:
      - ./apps/crawler/crawler_general/.env.docker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=download-urls
    depends_on:
      - biomed-crawler-db
      - rabbitmq

  crawler-dummy:
    build:
      context: .
      dockerfile: apps/crawler/crawler_dummy/Dockerfile
    env_file:
      - ./apps/crawler/crawler_dummy/.env.docker

  downloader-general:
    build:
      context: .
      dockerfile: apps/crawler/downloader_general/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=download-urls
      - DOWNLOAD_DESTINATION_DIR=/tmp/downloader-general
      - DOWNLOAD_TIMEOUT_SECONDS=30
      - DOWNLOAD_DEBUG_LARGE_FILE_MODE=true
      - DOWNLOAD_DEBUG_LARGE_FILE_THRESHOLD_MB=100
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=biomed-data
      - S3_DEBUG_PREFIX=downloader-debug
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - rabbitmq
      - minio-init


  management-backend:
    image: management-backend
    build:
      context: ./
      dockerfile: management-backend.Dockerfile
    env_file:
      - ./apps/management-backend/.env.docker
    ports:
      - "3002:3002"
    extra_hosts:
      # enables locally running services to be called via "host.docker.internal" as hostname
      - "host.docker.internal:host-gateway"
    depends_on:
      - biomed-db

  management-frontend:
    image: management-frontend
    build:
      context: ./
      dockerfile: management-frontend.Dockerfile
    ports:
      - "4201:80"
    depends_on:
      - management-backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/biomed-data;
      "

volumes:
  minio-data:

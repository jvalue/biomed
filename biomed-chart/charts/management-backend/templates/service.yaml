apiVersion: v1
kind: Service
metadata:
  name: {{ include "management-backend.fullname" . }}
  labels:
    {{- include "management-backend.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # ...

  selector:
    {{- include "management-backend.selectorLabels" . | nindent 4 }}

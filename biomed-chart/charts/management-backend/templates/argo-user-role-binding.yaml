apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-argo-user-binding-crawler-management-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-user-role
subjects:
  - kind: ServiceAccount
    name: {{ include "management-backend.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
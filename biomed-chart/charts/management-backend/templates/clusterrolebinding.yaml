{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "management-backend.fullname" . }}-cluster-reader-binding
  labels:
    {{- include "management-backend.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "management-backend.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "management-backend.fullname" . }}-cluster-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}


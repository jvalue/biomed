image:
  name: ghcr.io/jvalue/management-backend
  tag: 6fac5c6eca935be8b27b3fd31174c4df6dcc0ec2
  pullPolicy: IfNotPresent
  pullSecret: ghcr-login-secret

service:
  type: ClusterIP
  port: 3002

serviceAccount:
  create: true
  name: ""
  automount: true

httpRoute:
  enabled: false

autoscaling:
  enabled: false

secrets:
  databaseSecret: biomed-db-credentials
  backendSecret: backend-secrets

env:
  NODE_ENV: "production"
  PORT: 3002
  STAGE: "development"
  DATABASE_HOST: "biomed-database"
  DATABASE_PORT: 5435
  ARGO_BASE_URL: "http://localhost/argo/api/v1"
  KUBE_BEARER_TOKEN: "invalid-token"
  ORCHESTRATOR_SYNC_ENABLED: "true"
  KUBE_CONFIG_PATH: "dummy"

rbac:
  create: true

argoNamespace: argo-managed-crawler

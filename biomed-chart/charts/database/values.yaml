image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "16.1-alpine"

auth:
  user: "postgres"
  password: "postgres"
  database: "biomed-db"

service:
  type: ClusterIP
  port: 5435

serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false

autoscaling:
  enabled: false

httpRoute:
  enabled: false

persistence:
  enabled: true
  size: 1Gi
  # storageClassName: "standard"
